<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MOBA 3v3 · Lot 2</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e15; color: #f4f1e8; font-family: system-ui, sans-serif; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
    #status { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); padding: 8px 18px; border-radius: 8px; background: rgba(12,16,26,.88); border: 1px solid #ffd36b; font-weight: 600; }
    #help { position: fixed; right: 12px; bottom: 10px; font-size: 13px; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="status" hidden></div>
  <div id="help">Clic sol : se déplacer · Clic ennemi / sbire / tour : verrouiller · S : stop · D : debug · R : rejouer</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
