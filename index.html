<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Moby MOBA</title>
  <link rel="icon" href="assets/ui/icon.svg" type="image/svg+xml">
  <!-- Bloc généré par `npm run bump` : version, carte d'import des modules, manifeste, feuille de style. Ne pas éditer à la main. -->
  <!--version:start-->
  <script>window.APP_VERSION = "0.4.0";</script>
  <script type="importmap">{
  "imports": {
    "./src/input/pointer.js": "./src/input/pointer.js?v=0.4.0",
    "./src/main.js": "./src/main.js?v=0.4.0",
    "./src/render/animator.js": "./src/render/animator.js?v=0.4.0",
    "./src/render/renderer.js": "./src/render/renderer.js?v=0.4.0",
    "./src/sim/abilities.js": "./src/sim/abilities.js?v=0.4.0",
    "./src/sim/bot.js": "./src/sim/bot.js?v=0.4.0",
    "./src/sim/jungle.js": "./src/sim/jungle.js?v=0.4.0",
    "./src/sim/path.js": "./src/sim/path.js?v=0.4.0",
    "./src/sim/progression.js": "./src/sim/progression.js?v=0.4.0",
    "./src/sim/world.js": "./src/sim/world.js?v=0.4.0",
    "./src/ui/profile.js": "./src/ui/profile.js?v=0.4.0",
    "./src/ui/screens.js": "./src/ui/screens.js?v=0.4.0",
    "./src/ui/touch.js": "./src/ui/touch.js?v=0.4.0"
  }
}</script>
  <link rel="manifest" href="manifest.webmanifest?v=0.4.0">
  <link rel="stylesheet" href="styles/ui.css?v=0.4.0">
  <!--version:end-->
</head>
<body>
  <div id="app" data-screen="home">

    <!-- ===== ACCUEIL ===== -->
    <section id="screen-home" class="screen" aria-label="Accueil">
      <div class="bg-art" aria-hidden="true"></div>
      <header class="brand">
        <h1>Moby <span>MOBA</span></h1>
        <p class="tagline">3 contre 3 · parties de 10 minutes maximum</p>
      </header>
      <nav class="menu" aria-label="Menu principal">
        <button class="btn btn-primary btn-xl" id="btn-play" type="button">Jouer</button>
        <button class="btn btn-lg" id="btn-characters" type="button">Personnages</button>
        <button class="btn btn-lg" id="btn-shop" type="button">Boutique</button>
      </nav>
      <footer class="home-foot">
        <span class="chip" title="Personnage choisi"><span class="chip-label">Héros</span> <b id="home-hero">—</b></span>
        <span class="chip coins" title="Éclats"><i class="coin" aria-hidden="true"></i><b id="home-coins">0</b></span>
        <span class="chip version" id="version-label">v—</span>
      </footer>
    </section>

    <!-- ===== PERSONNAGES ===== -->
    <section id="screen-characters" class="screen" aria-label="Personnages">
      <header class="topbar">
        <button class="btn btn-back" type="button" data-go="home">← Accueil</button>
        <h2>Personnages</h2>
        <span class="chip coins"><i class="coin" aria-hidden="true"></i><b data-bind="coins">0</b></span>
      </header>
      <div class="split">
        <div id="char-grid" class="grid" role="list"></div>
        <aside id="char-detail" class="detail" aria-live="polite"></aside>
      </div>
    </section>

    <!-- ===== BOUTIQUE ===== -->
    <section id="screen-shop" class="screen" aria-label="Boutique">
      <header class="topbar">
        <button class="btn btn-back" type="button" data-go="home">← Accueil</button>
        <h2>Boutique</h2>
        <span class="chip coins"><i class="coin" aria-hidden="true"></i><b data-bind="coins">0</b></span>
      </header>
      <div id="shop-grid" class="grid shop" role="list"></div>
      <p id="shop-note" class="note">Les Éclats se gagnent en jouant. Aucun paiement réel dans cette version.</p>
    </section>

    <!-- ===== PARTIE ===== -->
    <section id="screen-game" class="screen game" aria-label="Partie">
      <canvas id="game"></canvas>

      <!-- Commandes tactiles (affichées sur écran tactile uniquement). Le style est dans styles/ui.css. -->
      <div id="touch" hidden>
        <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
        <div id="action-pad">
          <button id="btn-ult" class="act act-ult" type="button" data-slot="ult" aria-label="Ultime">
            <span class="key">R</span><span class="name"></span><span class="cd-num"></span><span class="lock-note"></span>
          </button>
          <button id="btn-skill" class="act act-skill" type="button" data-slot="skill" aria-label="Compétence">
            <span class="key">Q</span><span class="name"></span><span class="cd-num"></span><span class="lock-note"></span>
            <span class="pips" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button id="btn-attack" class="act act-attack" type="button" data-slot="attack" aria-label="Attaque">
            <span class="name">Attaque</span>
            <span class="pips" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button id="plus-skill" class="plus plus-skill" type="button" aria-label="Améliorer la compétence">+</button>
          <button id="plus-attack" class="plus plus-attack" type="button" aria-label="Améliorer l'attaque">+</button>
        </div>
      </div>

      <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause">❚❚</button>
      <div id="status" hidden></div>
      <div id="help"></div>

      <div id="pause" class="overlay" hidden>
        <div class="dialog">
          <h2>Pause</h2>
          <button class="btn btn-primary" id="btn-resume" type="button">Reprendre</button>
          <button class="btn" id="btn-quit" type="button">Quitter la partie</button>
        </div>
      </div>
      <div id="endcard" class="overlay" hidden>
        <div class="dialog">
          <h2 id="end-title">Victoire</h2>
          <p id="end-sub"></p>
          <p class="reward"><i class="coin" aria-hidden="true"></i> <b id="end-reward">+0</b> Éclats</p>
          <button class="btn btn-primary" id="btn-again" type="button">Rejouer</button>
          <button class="btn" id="btn-menu" type="button">Accueil</button>
        </div>
      </div>
    </section>

    <!-- Verrouillage du mode paysage : visible sur mobile tenu en portrait, la partie est alors en pause. -->
    <div id="rotate" class="overlay rotate" hidden>
      <div class="dialog">
        <div class="phone" aria-hidden="true"></div>
        <h2>Tournez votre appareil</h2>
        <p>Moby MOBA se joue en mode paysage.</p>
      </div>
    </div>
  </div>

  <!-- Bloc généré par `npm run bump` : script d'entrée versionné. -->
  <!--entry:start-->
  <script type="module" src="src/main.js?v=0.4.0"></script>
  <!--entry:end-->
</body>
</html>
